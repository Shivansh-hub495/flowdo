<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>25 Minute Flip Clock Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* --- START OF flipclock.css --- */
    /* Get the bourbon mixin from http://bourbon.io */
    /* Reset */
    .flip-clock-wrapper * {
        -webkit-box-sizing: border-box;
        -moz-box-sizing: border-box;
        -ms-box-sizing: border-box;
        -o-box-sizing: border-box;
        box-sizing: border-box;
        -webkit-backface-visibility: hidden;
        -moz-backface-visibility: hidden;
        -ms-backface-visibility: hidden;
        -o-backface-visibility: hidden;
        backface-visibility: hidden;
    }

    .flip-clock-wrapper a {
      cursor: pointer;
      text-decoration: none;
      color: #ccc; }

    .flip-clock-wrapper a:hover {
      color: #fff; }

    .flip-clock-wrapper ul {
      list-style: none; }

    .flip-clock-wrapper.clearfix:before,
    .flip-clock-wrapper.clearfix:after {
      content: " ";
      display: table; }

    .flip-clock-wrapper.clearfix:after {
      clear: both; }

    .flip-clock-wrapper.clearfix {
      zoom: 1; }

    /* Main */
    .flip-clock-wrapper {
      font: normal 11px "Helvetica Neue", Helvetica, sans-serif;
      -webkit-user-select: none;
    }

    .flip-clock-meridium {
      background: none !important;
      box-shadow: 0 0 0 !important;
      font-size: 36px !important; }

    .flip-clock-meridium a { color: #313333; }

    .flip-clock-wrapper {
      text-align: center;
      position: relative;
      width: 100%;
      margin: 1em;
      filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.1));
      /* Ensure proper spacing and prevent overflow */
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: nowrap;
      overflow: visible;
    }

    .flip-clock-wrapper:before,
    .flip-clock-wrapper:after {
        content: " "; /* 1 */
        display: table; /* 2 */
    }
    .flip-clock-wrapper:after {
        clear: both;
    }

    /* Skeleton */
    .flip-clock-wrapper ul {
      position: relative;
      float: left;
      margin: 12px;
      width: 150px;
      height: 240px;
      font-size: 150px;
      font-weight: 700;
      line-height: 235px;
      border-radius: 8px;
      background: linear-gradient(145deg, #1e1e1e, #0a0a0a);
      box-shadow:
        0 25px 50px rgba(0, 0, 0, 0.9),
        0 15px 30px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        inset 0 -1px 0 rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(120, 119, 198, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transform: perspective(800px) rotateX(3deg);
      transition: all 0.3s ease;
      /* Prevent overflow during animations */
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .flip-clock-wrapper ul li {
      z-index: 1;
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      line-height: 240px;
      text-decoration: none !important;
    }

    .flip-clock-wrapper ul li:first-child {
      z-index: 2; }

    .flip-clock-wrapper ul li a {
      display: block;
      height: 100%;
      -webkit-perspective: 400px;
      -moz-perspective: 400px;
      perspective: 400px;
      margin: 0 !important;
      overflow: hidden !important;
      cursor: default !important; }

    .flip-clock-wrapper ul li a div {
      z-index: 1;
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      font-size: 140px;
      overflow: hidden;
      outline: 1px solid transparent; }

    .flip-clock-wrapper ul li a div .shadow {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 2; }

    .flip-clock-wrapper ul li a div.up {
      -webkit-transform-origin: 50% 100%;
      -moz-transform-origin: 50% 100%;
      -ms-transform-origin: 50% 100%;
      -o-transform-origin: 50% 100%;
      transform-origin: 50% 100%;
      top: 0; }

    .flip-clock-wrapper ul li a div.up:after {
      content: "";
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 5;
      width: 100%;
      height: 4px;
      background-color: #000;
      background-color: rgba(0, 0, 0, 0.4);
      transform: translateY(-100%); }

    .flip-clock-wrapper ul li a div.down {
      -webkit-transform-origin: 50% 0;
      -moz-transform-origin: 50% 0;
      -ms-transform-origin: 50% 0;
      -o-transform-origin: 50% 0;
      transform-origin: 50% 0;
      bottom: 0;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
    }

    .flip-clock-wrapper ul li a div div.inn {
      position: absolute;
      left: 0;
      z-index: 1;
      width: 100%;
      height: 200%;
      color: #ffffff;
      text-shadow:
        0 3px 6px rgba(0, 0, 0, 0.9),
        0 0 25px rgba(120, 119, 198, 0.5),
        0 0 50px rgba(120, 119, 198, 0.3);
      text-align: center;
      background: linear-gradient(145deg, #2a2a2a, #151515);
      border-radius: 8px;
      font-size: 160px;
      font-weight: 700;
      font-family: "Montserrat", sans-serif;
      letter-spacing: 1px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .flip-clock-wrapper ul li a div.up div.inn {
      top: 0; }

    .flip-clock-wrapper ul li a div.down div.inn {
      bottom: 0; }

    /* PLAY */
    .flip-clock-wrapper ul.play li.flip-clock-before {
      z-index: 3; }

    .flip-clock-wrapper .flip {
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4),
                    0 4px 8px rgba(0, 0, 0, 0.3),
                    0 0 20px rgba(255, 255, 255, 0.1);
        /* Constrain the card during flip to prevent overlap */
        transform: perspective(800px) rotateX(3deg) !important;
        overflow: hidden;
        max-width: 150px;
        max-height: 240px;
    }

    .flip-clock-wrapper ul.play li.flip-clock-active {
      -webkit-animation: asd 0.01s 0.49s linear both;
      -moz-animation: asd 0.01s 0.49s linear both;
      animation: asd 0.01s 0.49s linear both;
      z-index: 5;
      /* Prevent expansion during animation */
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
    }

    .flip-clock-divider {
      float: left;
      display: inline-block;
      position: relative;
      width: 50px;
      height: 240px;
      margin: 0 20px;
      margin-top: 0px; }

    .flip-clock-divider:first-child {
      width: 0; }

    .flip-clock-dot {
      display: block;
      background: linear-gradient(145deg, #ffffff, #e0e0e0);
      width: 20px;
      height: 20px;
      position: absolute;
      border-radius: 50%;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3),
                  0 3px 6px rgba(0, 0, 0, 0.2),
                  inset 0 2px 0 rgba(255, 255, 255, 0.8),
                  inset 0 -2px 0 rgba(0, 0, 0, 0.1);
      left: 9px;
      border: 2px solid rgba(255, 255, 255, 0.3); }

    .flip-clock-divider .flip-clock-label {
      position: absolute;
      top: -1.5em;
      right: -86px;
      color: black;
      text-shadow: none; }

    .flip-clock-divider.minutes .flip-clock-label {
      right: -88px; }

    .flip-clock-divider.seconds .flip-clock-label {
      right: -91px; }

    .flip-clock-dot.top {
      top: 80px; }

    .flip-clock-dot.bottom {
      bottom: 80px; }

    @-webkit-keyframes asd {
      0% {
        z-index: 2; }

      100% {
        z-index: 4; } }

    @-moz-keyframes asd {
      0% {
        z-index: 2; }

      100% {
        z-index: 4; } }

    @-o-keyframes asd {
      0% {
        z-index: 2; }

      100% {
        z-index: 4; } }

    @keyframes asd {
      0% {
        z-index: 2; }

      100% {
        z-index: 4; } }

    .flip-clock-wrapper ul.play li.flip-clock-active .down {
      z-index: 2;
      -webkit-animation: turn 0.5s 0.5s linear both;
      -moz-animation: turn 0.5s 0.5s linear both;
      animation: turn 0.5s 0.5s linear both; }

    @-webkit-keyframes turn {
      0% {
        -webkit-transform: rotateX(90deg) scale(1); }

      100% {
        -webkit-transform: rotateX(0deg) scale(1); } }

    @-moz-keyframes turn {
      0% {
        -moz-transform: rotateX(90deg) scale(1); }

      100% {
        -moz-transform: rotateX(0deg) scale(1); } }

    @-o-keyframes turn {
      0% {
        -o-transform: rotateX(90deg) scale(1); }

      100% {
        -o-transform: rotateX(0deg) scale(1); } }

    @keyframes turn {
      0% {
        transform: rotateX(90deg) scale(1); }

      100% {
        transform: rotateX(0deg) scale(1); } }

    .flip-clock-wrapper ul.play li.flip-clock-before .up {
      z-index: 2;
      -webkit-animation: turn2 0.5s linear both;
      -moz-animation: turn2 0.5s linear both;
      animation: turn2 0.5s linear both; }

    @-webkit-keyframes turn2 {
      0% {
        -webkit-transform: rotateX(0deg) scale(1); }

      100% {
        -webkit-transform: rotateX(-90deg) scale(1); } }

    @-moz-keyframes turn2 {
      0% {
        -moz-transform: rotateX(0deg) scale(1); }

      100% {
        -moz-transform: rotateX(-90deg) scale(1); } }

    @-o-keyframes turn2 {
      0% {
        -o-transform: rotateX(0deg) scale(1); }

      100% {
        -o-transform: rotateX(-90deg) scale(1); } }

    @keyframes turn2 {
      0% {
        transform: rotateX(0deg) scale(1); }

      100% {
        transform: rotateX(-90deg) scale(1); } }

    .flip-clock-wrapper ul li.flip-clock-active {
      z-index: 3; }

    /* SHADOW */
    .flip-clock-wrapper ul.play li.flip-clock-before .up .shadow {
      background: -moz-linear-gradient(top, rgba(0, 0, 0, 0.1) 0%, black 100%);
      background: -webkit-gradient(linear, left top, left bottom, color-stop(0%, rgba(0, 0, 0, 0.1)), color-stop(100%, black));
      background: linear, top, rgba(0, 0, 0, 0.1) 0%, black 100%;
      background: -o-linear-gradient(top, rgba(0, 0, 0, 0.1) 0%, black 100%);
      background: -ms-linear-gradient(top, rgba(0, 0, 0, 0.1) 0%, black 100%);
      background: linear, to bottom, rgba(0, 0, 0, 0.1) 0%, black 100%;
      -webkit-animation: show 0.5s linear both;
      -moz-animation: show 0.5s linear both;
      animation: show 0.5s linear both; }

    .flip-clock-wrapper ul.play li.flip-clock-active .up .shadow {
      background: -moz-linear-gradient(top, rgba(0, 0, 0, 0.1) 0%, black 100%);
      background: -webkit-gradient(linear, left top, left bottom, color-stop(0%, rgba(0, 0, 0, 0.1)), color-stop(100%, black));
      background: linear, top, rgba(0, 0, 0, 0.1) 0%, black 100%;
      background: -o-linear-gradient(top, rgba(0, 0, 0, 0.1) 0%, black 100%);
      background: -ms-linear-gradient(top, rgba(0, 0, 0, 0.1) 0%, black 100%);
      background: linear, to bottom, rgba(0, 0, 0, 0.1) 0%, black 100%;
      -webkit-animation: hide 0.5s 0.3s linear both;
      -moz-animation: hide 0.5s 0.3s linear both;
      animation: hide 0.5s 0.3s linear both; }

    /*DOWN*/
    .flip-clock-wrapper ul.play li.flip-clock-before .down .shadow {
      background: -moz-linear-gradient(top, black 0%, rgba(0, 0, 0, 0.1) 100%);
      background: -webkit-gradient(linear, left top, left bottom, color-stop(0%, black), color-stop(100%, rgba(0, 0, 0, 0.1)));
      background: linear, top, black 0%, rgba(0, 0, 0, 0.1) 100%;
      background: -o-linear-gradient(top, black 0%, rgba(0, 0, 0, 0.1) 100%);
      background: -ms-linear-gradient(top, black 0%, rgba(0, 0, 0, 0.1) 100%);
      background: linear, to bottom, black 0%, rgba(0, 0, 0, 0.1) 100%;
      -webkit-animation: show 0.5s linear both;
      -moz-animation: show 0.5s linear both;
      animation: show 0.5s linear both; }

    .flip-clock-wrapper ul.play li.flip-clock-active .down .shadow {
      background: -moz-linear-gradient(top, black 0%, rgba(0, 0, 0, 0.1) 100%);
      background: -webkit-gradient(linear, left top, left bottom, color-stop(0%, black), color-stop(100%, rgba(0, 0, 0, 0.1)));
      background: linear, top, black 0%, rgba(0, 0, 0, 0.1) 100%;
      background: -o-linear-gradient(top, black 0%, rgba(0, 0, 0, 0.1) 100%);
      background: -ms-linear-gradient(top, black 0%, rgba(0, 0, 0, 0.1) 100%);
      background: linear, to bottom, black 0%, rgba(0, 0, 0, 0.1) 100%;
      -webkit-animation: hide 0.5s 0.3s linear both;
      -moz-animation: hide 0.5s 0.3s linear both;
      animation: hide 0.5s 0.2s linear both; }

    @-webkit-keyframes show {
      0% {
        opacity: 0; }

      100% {
        opacity: 1; } }

    @-moz-keyframes show {
      0% {
        opacity: 0; }

      100% {
        opacity: 1; } }

    @-o-keyframes show {
      0% {
        opacity: 0; }

      100% {
        opacity: 1; } }

    @keyframes show {
      0% {
        opacity: 0; }

      100% {
        opacity: 1; } }

    @-webkit-keyframes hide {
      0% {
        opacity: 1; }

      100% {
        opacity: 0; } }

    @-moz-keyframes hide {
      0% {
        opacity: 1; }

      100% {
        opacity: 0; } }

    @-o-keyframes hide {
      0% {
        opacity: 1; }

      100% {
        opacity: 0; } }

    @keyframes hide {
      0% {
        opacity: 1; }

      100% {
        opacity: 0; } }

    /* --- END OF flipclock.css --- */

    /* --- START OF style.css --- */
    *
    {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body
    {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #0a0a0a;
        background-image:
            radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
            radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
            radial-gradient(circle at 40% 40%, rgba(120, 119, 198, 0.1) 0%, transparent 50%);
        font-family: "Montserrat", "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #ffffff;
    }
    .clock
    {
        width: auto;
        display: flex;
        justify-content: center;
        padding: 30px 0;
        background: none;
        border: none;
        box-shadow: none;
        position: relative;
        margin: 20px 0;
    }
    .flip-clock-dot
    {
        background: linear-gradient(145deg, #7877c6, #5a59a3);
        box-shadow:
            0 4px 8px rgba(120, 119, 198, 0.4),
            0 0 20px rgba(120, 119, 198, 0.3);
    }
    .flip-clock-meridium a
    {
        color: #ffffff;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        font-weight: 600;
    }
    /* --- END OF style.css --- */

    /* Custom style for end message */
    .clock h2 {
        color: #ffffff;
        font-size: 4em;
        font-family: "Montserrat", "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        text-shadow:
            0 4px 8px rgba(0, 0, 0, 0.8),
            0 0 30px rgba(120, 119, 198, 0.6),
            0 0 60px rgba(255, 119, 198, 0.4);
        font-weight: 700;
        letter-spacing: 1px;
        background: linear-gradient(135deg, #ffffff, #7877c6, #ff77c6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    /* Hide the minutes and seconds labels */
    .flip-clock-divider .flip-clock-label {
        display: none !important;
    }

    /* Hide the first divider (extra dots) completely */
    .flip-clock-divider:first-child {
        display: none !important;
    }

    /* Add subtle pulsing animation to dots */
    @keyframes pulse {
        0%, 100% {
            opacity: 0.8;
            transform: scale(1);
        }
        50% {
            opacity: 1;
            transform: scale(1.1);
        }
    }

    .flip-clock-dot {
        animation: pulse 2s ease-in-out infinite;
    }

    /* Add hover effects for interactive feel */
    .flip-clock-wrapper ul:hover {
        transform: perspective(800px) rotateX(3deg) translateY(-3px);
        box-shadow:
            0 30px 60px rgba(0, 0, 0, 0.9),
            0 15px 30px rgba(0, 0, 0, 0.8),
            inset 0 1px 0 rgba(255, 255, 255, 0.15),
            inset 0 -1px 0 rgba(0, 0, 0, 0.8),
            0 0 0 1px rgba(120, 119, 198, 0.5),
            0 0 40px rgba(120, 119, 198, 0.3);
        transition: all 0.3s ease;
    }

    .flip-clock-wrapper ul {
        transition: all 0.3s ease;
        /* Ensure cards don't overlap during animations */
        flex-shrink: 0;
        margin: 12px;
    }

    /* Consistent spacing between all cards */
    .flip-clock-wrapper ul {
        margin: 12px;
    }

    /* Consistent spacing between card pairs */
    .flip-clock-divider {
        margin: 0 20px;
    }


    /* Increase spacing for second digits to match minutes spacing */
    .flip-clock-wrapper ul:nth-child(4) {
        margin-left: 6px;
        margin-right: -6px;
    }

    .flip-clock-wrapper ul:nth-child(5) {
        margin-left: -6px;
    }

    /* Additional constraint for play state to prevent overlap */
    .flip-clock-wrapper ul.play {
        transform: perspective(800px) rotateX(3deg) !important;
        overflow: hidden;
    }

    /* Timer Container */
    .timer-container {
        text-align: center;
        padding: 0;
        background: none;
        border: none;
        box-shadow: none;
        margin: 20px;
        max-width: 1000px;
        width: 100%;
        position: relative;
    }



    /* Time Selector */
    .time-selector {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        margin: 40px 0 50px 0;
        flex-wrap: wrap;
    }

    .time-btn {
        background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #ffffff;
        padding: 14px 24px;
        border-radius: 6px;
        font-size: 1em;
        font-weight: 600;
        font-family: "Montserrat", sans-serif;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow:
            0 4px 8px rgba(0, 0, 0, 0.4),
            inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .time-btn:hover {
        background: linear-gradient(145deg, #3a3a3a, #2a2a2a);
        border-color: rgba(120, 119, 198, 0.4);
        transform: translateY(-2px);
        box-shadow:
            0 8px 16px rgba(0, 0, 0, 0.6),
            0 0 20px rgba(120, 119, 198, 0.2);
    }

    .time-btn.active {
        background: linear-gradient(135deg, #7877c6, #5a59a3);
        border-color: rgba(120, 119, 198, 0.8);
        box-shadow:
            0 8px 16px rgba(120, 119, 198, 0.4),
            0 0 30px rgba(120, 119, 198, 0.3),
            inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .custom-time {
        display: flex;
        gap: 8px;
        align-items: center;
    }

    #customMinutes {
        background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #ffffff;
        padding: 12px 16px;
        border-radius: 6px;
        width: 110px;
        text-align: center;
        font-size: 0.9em;
        font-weight: 600;
        font-family: "Montserrat", sans-serif;
        box-shadow:
            inset 0 2px 4px rgba(0, 0, 0, 0.4),
            0 1px 0 rgba(255, 255, 255, 0.1);
    }

    #customMinutes::placeholder {
        color: rgba(255, 255, 255, 0.5);
    }

    #customMinutes:focus {
        outline: none;
        border-color: rgba(120, 119, 198, 0.6);
        box-shadow:
            inset 0 2px 4px rgba(0, 0, 0, 0.4),
            0 0 20px rgba(120, 119, 198, 0.2);
    }

    #setCustomTime {
        background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #ffffff;
        padding: 12px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9em;
        font-weight: 600;
        font-family: "Montserrat", sans-serif;
        transition: all 0.3s ease;
        box-shadow:
            0 4px 8px rgba(0, 0, 0, 0.4),
            inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    #setCustomTime:hover {
        background: linear-gradient(145deg, #3a3a3a, #2a2a2a);
        border-color: rgba(120, 119, 198, 0.4);
        transform: translateY(-1px);
        box-shadow:
            0 6px 12px rgba(0, 0, 0, 0.6),
            0 0 20px rgba(120, 119, 198, 0.2);
    }

    /* Controls */
    .controls {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 50px 0 30px 0;
        flex-wrap: wrap;
    }

    .control-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        font-size: 0.95em;
        font-weight: 700;
        font-family: "Montserrat", sans-serif;
        cursor: pointer;
        transition: all 0.3s ease;
        min-width: 110px;
        justify-content: center;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .control-btn.primary {
        background: linear-gradient(135deg, #00d4aa, #00b894);
        color: #ffffff;
        box-shadow:
            0 8px 16px rgba(0, 212, 170, 0.3),
            0 0 30px rgba(0, 212, 170, 0.2),
            inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .control-btn.primary:hover {
        background: linear-gradient(135deg, #00b894, #00a085);
        transform: translateY(-3px);
        box-shadow:
            0 12px 24px rgba(0, 212, 170, 0.4),
            0 0 40px rgba(0, 212, 170, 0.3);

<body>


  <div class="timer-container">
    <!-- Time Selection -->
    <div class="time-selector">
      <button class="time-btn active" data-time="25">25 min</button>
      <button class="time-btn" data-time="30">30 min</button>
      <button class="time-btn" data-time="45">45 min</button>
      <button class="time-btn" data-time="60">60 min</button>
      <div class="custom-time">
        <input type="number" id="customMinutes" min="1" max="999" placeholder="Custom">
        <button id="setCustomTime">Set</button>
      </div>
    </div>

    <!-- Timer Display -->
    <div class="clock"></div>

    <!-- Control Buttons -->
    <div class="controls">
      <button id="startPauseBtn" class="control-btn primary">
        <span class="btn-icon">▶</span>
        <span class="btn-text">Start</span>
      </button>
      <button id="switchBtn" class="control-btn secondary rest-mode">
        <span class="btn-text">Switch</span>
      </button>
      <button id="resetBtn" class="control-btn secondary">
        <span class="btn-icon">⏹</span>
        <span class="btn-text">Reset</span>
      </button>
      <button id="restartBtn" class="control-btn secondary">
        <span class="btn-text">Restart</span>
      </button>
    </div>

    <!-- Timer Info -->
    <div class="timer-info">
      <p id="timerStatus">Ready to focus! Select your time and press start.</p>
    </div>
  </div>

  <!-- Sound Control Button (Right Bottom Corner) -->
  <div class="sound-control">
    <button id="soundBtn" class="sound-btn">
      <span class="sound-icon">🔊</span>
    </button>

    <!-- Drop-up Menu -->
    <div id="soundMenu" class="sound-menu">
      <!-- Volume Controls -->
      <div class="volume-control">
        <label>Volume</label>
        <div class="volume-buttons">
          <button id="volumeDown" class="volume-btn">-</button>
          <span id="volumeDisplay">50%</span>
          <button id="volumeUp" class="volume-btn">+</button>
        </div>
      </div>

      <!-- Play/Pause Controls -->
      <div class="playback-control">
        <button id="playPauseSound" class="playback-btn">
          <span class="playback-icon">▶</span>
          <span class="playback-text">Play</span>
        </button>
      </div>

      <!-- Sound Selection -->
      <div class="sound-selection">
        <label>Choose Sound</label>
        <div class="sound-options">
          <button class="sound-option active" data-sound="sounds/Sound1.mp3">Sound 1</button>
          <button class="sound-option" data-sound="sounds/Drum.mp3">Drum</button>
          <button class="sound-option" data-sound="sounds/Rain.mp3">Rain</button>
          <button class="sound-option" data-sound="sounds/Rewire.mp3">Rewire</button>
          <button class="sound-option" data-sound="sounds/Waves.mp3">Waves</button>
        </div>
      </div>

      <!-- Clock Sound (Timer Only) -->
      <div class="clock-sound-section">
        <label>Clock Sound (Timer Only)</label>
        <div class="clock-sound-control">
          <button id="clockSoundToggle" class="clock-sound-btn disabled">

          </button>
          <div class="clock-sound-info">
            <small>Only available when timer is running</small>
          </div>
        </div>
      </div>
    </div>
  </div>

    <source src="sounds/Sound1.mp3" type="audio/mpeg">
  </audio>

    /* --- ENHANCED TIMER SCRIPT --- */
    $(document).ready(function() {
      let clock = null;
      let currentTime = 25 * 60; // Default 25 minutes
      let isRunning = false;
      let isPaused = false;
      let isBreakTime = false; // Track if we're in break mode
      let focusTimeMinutes = 25; // Store the original focus time for restoration
      let focusSessionCompleted = false; // Track if focus session was completed

      // Initialize the timer
      function initTimer(timeInMinutes, isBreak = false) {
        currentTime = timeInMinutes * 60;
        isBreakTime = isBreak;

        // Store focus time for restoration after break
        if (!isBreak) {
          focusTimeMinutes = timeInMinutes;
        }

        // Destroy existing clock if it exists
        if (clock) {
          clock.stop();
          $('.clock').empty();
        }

        // Create new clock
        clock = $('.clock').FlipClock(currentTime, {
          clockFace: 'MinuteCounter',
          countdown: true,
          autoStart: false,
          callbacks: {
            interval: function() {
              updateStatus();
            },
            stop: function() {
              // Only trigger completion if timer reached 0, not if manually paused
              if (clock.getTime().time === 0) {
                handleTimerComplete();
              }
            }
          }
        });

        updateButtons();
        updateStatus();
      }

      // Handle timer completion
      function handleTimerComplete() {
        isRunning = false;
        isPaused = false;

        // Play completion sound (if browser supports it)
        try {
          const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT');
          audio.play().catch(() => {}); // Ignore errors if audio fails
        } catch (e) {}

        if (!isBreakTime) {
          // Focus session completed - mark as completed but DO NOT auto-start break
          focusSessionCompleted = true;
          $('.clock').html('<h2>🎉 Focus Complete! 🎉</h2>');
          $('#timerStatus').html('Great job! Press the RED SWITCH button to switch to Rest Mode 🔴');
          updateButtons();
          updateStatus();
          // No automatic transition - user must press switch button to go to rest mode

        } else {
          // Break completed - DO NOT automatically switch back to focus
          $('.clock').html('<h2>☕ Break Complete! ☕</h2>');
          $('#timerStatus').html('Break finished! Press the RED SWITCH button to switch to Focus Mode 🔴');
          updateButtons();
          updateStatus();
          // No automatic transition - user must press switch button
        }
      }

      // Update button states
      function updateButtons() {
        const startPauseBtn = $('#startPauseBtn');
        const btnIcon = startPauseBtn.find('.btn-icon');
        const btnText = startPauseBtn.find('.btn-text');
        const switchBtn = $('#switchBtn');
        const resetBtn = $('#resetBtn');

        // Handle switch button appearance - always enabled and red
        switchBtn.addClass('rest-mode');
        switchBtn.find('.btn-text').text('Switch');
        switchBtn.prop('disabled', false);
        switchBtn.show();

        // Reset button is always visible and always resets current timer
        resetBtn.removeClass('rest-mode');
        resetBtn.find('.btn-text').text('Reset');

        if (!isRunning && !isPaused) {
          // Ready to start
          btnIcon.text('▶');
          btnText.text('Start');
          startPauseBtn.removeClass('pause');
        } else if (isRunning) {
          // Currently running
          btnIcon.text('⏸');
          btnText.text('Pause');
          startPauseBtn.addClass('pause');
        } else if (isPaused) {
          // Paused
          btnIcon.text('▶');
          btnText.text('Resume');
          startPauseBtn.removeClass('pause');
        }
      }

      // Update status message
      function updateStatus() {
        if (!isRunning && !isPaused) {
          if (isBreakTime) {
            $('#timerStatus').text('REST MODE: Press start for break, or RED SWITCH button to switch to Focus Mode 🔴');
          } else if (focusSessionCompleted) {
            $('#timerStatus').text('FOCUS MODE: Focus session completed! Press RED SWITCH button to switch to Rest Mode 🔴');
          } else {
            $('#timerStatus').text('FOCUS MODE: Ready to concentrate! Complete a focus session to unlock Rest Mode 🎯');
          }
        } else if (isRunning) {
          const remaining = clock.getTime().time;
          const minutes = Math.floor(remaining / 60);
          const seconds = remaining % 60;
          if (isBreakTime) {
            $('#timerStatus').text(`REST MODE: ${minutes}:${seconds.toString().padStart(2, '0')} remaining. Relax and recharge! ☕`);
          } else {
            $('#timerStatus').text(`FOCUS MODE: ${minutes}:${seconds.toString().padStart(2, '0')} remaining. Stay concentrated! 🎯`);
          }
        } else if (isPaused) {
          if (isBreakTime) {
            $('#timerStatus').text('REST MODE paused. Press resume to continue break, or RED SWITCH button to switch modes 🔴');
          } else {
            $('#timerStatus').text('FOCUS MODE paused. Press resume to continue focus, or RED SWITCH button to switch modes 🔴');
          }
        }
      }

      // Time selection buttons
      $('.time-btn').click(function() {
        const minutes = parseInt($(this).data('time'));
        $('.time-btn').removeClass('active');
        $(this).addClass('active');
        $('#customMinutes').val('');

        // Reset timer state and exit break mode
        isRunning = false;
        isPaused = false;
        isBreakTime = false;
        focusSessionCompleted = false; // Reset completion flag

        initTimer(minutes, false);
      });

      // Custom time input
      $('#setCustomTime').click(function() {
        const customMinutes = parseInt($('#customMinutes').val());
        if (customMinutes && customMinutes > 0 && customMinutes <= 999) {
          $('.time-btn').removeClass('active');

          // Reset timer state and exit break mode
          isRunning = false;
          isPaused = false;
          isBreakTime = false;
          focusSessionCompleted = false; // Reset completion flag

          initTimer(customMinutes, false);
          $('#timerStatus').text(`Custom timer set for ${customMinutes} minutes. Press start when ready!`);
        } else {
          alert('Please enter a valid time between 1 and 999 minutes.');
        }
      });

      // Enter key for custom time
      $('#customMinutes').keypress(function(e) {
        if (e.which === 13) {
          $('#setCustomTime').click();
        }
      });

      // Start/Pause button
      $('#startPauseBtn').click(function() {
        if (!isRunning && !isPaused) {
          // Start timer
          clock.start();
          isRunning = true;
          isPaused = false;
        } else if (isRunning) {
          // Pause timer
          clock.stop();
          isRunning = false;
          isPaused = true;
        } else if (isPaused) {
          // Resume timer
          clock.start();
          isRunning = true;
          isPaused = false;
        }

        updateButtons();
        updateStatus();
      });

      // Switch button - Toggle between Focus and Rest modes
      $('#switchBtn').click(function() {
        if (clock) {
          clock.stop();
          isRunning = false;
          isPaused = false;

          if (isBreakTime) {
            // Switch from Rest mode to Focus mode
            isBreakTime = false;
            focusSessionCompleted = false; // Reset completion flag
            initTimer(focusTimeMinutes, false);
            $('#timerStatus').text('Switched to Focus Mode! Ready to concentrate 🎯');
          } else {
            // Switch to Rest mode (always allow)
            isBreakTime = true;
            initTimer(5, true); // 5-minute break
            $('#timerStatus').text('Switched to Rest Mode! Time for a 5-minute break ☕');
          }

          updateButtons();
          updateStatus();
        }
      });

      // Reset button - Always resets the current timer to its original time
      $('#resetBtn').click(function() {
        if (clock) {
          clock.stop();
          isRunning = false;
          isPaused = false;

          if (isBreakTime) {
            // Reset the 5-minute break timer
            initTimer(5, true);
            $('#timerStatus').text('Break timer reset! Press start when ready ☕');
          } else {
            // Reset the current focus timer
            const activeBtn = $('.time-btn.active');
            let minutes = 25; // default

            if (activeBtn.length > 0) {
              minutes = parseInt(activeBtn.data('time'));
            } else {
              const customTime = parseInt($('#customMinutes').val());
              if (customTime && customTime > 0) {
                minutes = customTime;
              }
            }

            initTimer(minutes, false);
            $('#timerStatus').text('Focus timer reset! Press start when ready 🎯');
          }

          updateButtons();
          updateStatus();
        }
      });

      // Restart button
      $('#restartBtn').click(function() {
        if (clock) {
          let minutes = 25; // default
          let shouldBeBreak = isBreakTime;

          if (isBreakTime) {
            // If in break mode, restart the 5-minute break
            minutes = 5;
          } else {
            // Get current selected time for focus mode
            const activeBtn = $('.time-btn.active');

            if (activeBtn.length > 0) {
              minutes = parseInt(activeBtn.data('time'));
            } else {
              const customTime = parseInt($('#customMinutes').val());
              if (customTime && customTime > 0) {
                minutes = customTime;
              }
            }
          }

          // Reset and start immediately
          isRunning = false;
          isPaused = false;
          initTimer(minutes, shouldBeBreak);

          // Start the timer
          setTimeout(() => {
            clock.start();
            isRunning = true;
            updateButtons();
            updateStatus();
          }, 100);
        }
      });

      // Sound Control System
      let currentVolume = 0.5; // 50%
      let isAudioPlaying = false;
      let shouldPlayAudio = false;
      const audio = document.getElementById('backgroundAudio');

      // Clock Sound Control System (Timer Only)
      let isClockSoundEnabled = false;
      let isClockSoundPlaying = false;
      const clockAudio = document.getElementById('clockAudio');

      // Set initial volume
      audio.volume = currentVolume;
      clockAudio.volume = currentVolume;

      // Sound button hover - show/hide menu
      $('.sound-control').hover(
        function() {
          // Mouse enter
          $('#soundMenu').addClass('show');
        },
        function() {
          // Mouse leave
          $('#soundMenu').removeClass('show');
        }
      );

      // Volume controls
      $('#volumeUp').click(function() {
        if (currentVolume < 1) {
          currentVolume = Math.min(1, currentVolume + 0.1);
          audio.volume = currentVolume;
          clockAudio.volume = currentVolume;
          updateVolumeDisplay();
        }
      });

      $('#volumeDown').click(function() {
        if (currentVolume > 0) {
          currentVolume = Math.max(0, currentVolume - 0.1);
          audio.volume = currentVolume;
          clockAudio.volume = currentVolume;
          updateVolumeDisplay();
        }
      });

      function updateVolumeDisplay() {
        $('#volumeDisplay').text(Math.round(currentVolume * 100) + '%');
      }

      // Play/Pause controls
      $('#playPauseSound').click(function() {
        if (isAudioPlaying) {
          pauseAudio();
        } else {
          playAudio();
        }
      });

      function playAudio() {
        audio.play().then(() => {
          isAudioPlaying = true;
          shouldPlayAudio = true;
          $('#playPauseSound .playback-icon').text('⏸');
          $('#playPauseSound .playback-text').text('Pause');
        }).catch(e => {
          console.log('Audio play failed:', e);
        });
      }

      function pauseAudio() {
        audio.pause();
        isAudioPlaying = false;
        shouldPlayAudio = false;
        $('#playPauseSound .playback-icon').text('▶');
        $('#playPauseSound .playback-text').text('Play');
      }

      // Sound selection
      $('.sound-option').click(function() {
        $('.sound-option').removeClass('active');
        $(this).addClass('active');

        const soundPath = $(this).data('sound');
        const wasPlaying = isAudioPlaying;

        // Pause current audio
        if (isAudioPlaying) {
          pauseAudio();
        }

        // Change source
        audio.src = soundPath;

        // Resume if it was playing
        if (wasPlaying && shouldPlayAudio) {
          setTimeout(() => playAudio(), 100);
        }
      });

      // Clock Sound Toggle
      $('#clockSoundToggle').click(function() {
        if (!$(this).hasClass('disabled')) {
          isClockSoundEnabled = !isClockSoundEnabled;
          updateClockSoundButton();

          if (isClockSoundEnabled && isRunning) {
            playClockSound();
          } else {
            pauseClockSound();
          }
        }
      });

      // Clock Sound Functions
      function playClockSound() {
        if (isClockSoundEnabled && isRunning) {
          clockAudio.play().then(() => {
            isClockSoundPlaying = true;
          }).catch(e => {
            console.log('Clock audio play failed:', e);
          });
        }
      }

      function pauseClockSound() {
        clockAudio.pause();
        isClockSoundPlaying = false;
      }

      function updateClockSoundButton() {
        const button = $('#clockSoundToggle');
        const text = button.find('.clock-text');

        if (!isRunning) {
          button.addClass('disabled').removeClass('active');
          text.text('Clock (Disabled)');
        } else {
          button.removeClass('disabled');
          if (isClockSoundEnabled) {
            button.addClass('active');
            text.text('Clock (On)');
          } else {
            button.removeClass('active');
            text.text('Clock (Off)');
          }
        }
      }

      // Auto-play audio when timer starts (if user has interacted with audio controls)
      function handleTimerStart() {
        if (shouldPlayAudio && !isAudioPlaying) {
          playAudio();
        }
        // Enable and potentially start clock sound
        updateClockSoundButton();
        if (isClockSoundEnabled) {
          playClockSound();
        }
      }

      // Auto-pause audio when timer stops/completes
      function handleTimerStop() {
        if (isAudioPlaying) {
          pauseAudio();
        }
        // Stop and disable clock sound
        pauseClockSound();
        updateClockSoundButton();
      }

      // Integrate with existing timer controls
      const originalStartPauseClick = $('#startPauseBtn').click;
      $('#startPauseBtn').off('click').click(function() {
        if (!isRunning && !isPaused) {
          // Start timer
          clock.start();
          isRunning = true;
          isPaused = false;
          handleTimerStart();
        } else if (isRunning) {
          // Pause timer
          clock.stop();
          isRunning = false;
          isPaused = true;
          handleTimerStop();
        } else if (isPaused) {
          // Resume timer
          clock.start();
          isRunning = true;
          isPaused = false;
          handleTimerStart();
        }

        updateButtons();
        updateStatus();
      });

      // Initialize Clock sound button state
      updateClockSoundButton();

      // Initialize with default 25 minutes (focus mode)
      initTimer(25, false);

      // Mobile Responsive Handling
      function handleMobileResponsive() {
        // Mobile responsive adjustments without orientation restrictions
        adjustClockForMobile();
        adjustSoundMenuForMobile();
      }

      // Mobile Touch Enhancements
      function addMobileTouchEnhancements() {
        // Add touch feedback for buttons
        const buttons = document.querySelectorAll('.time-btn, .control-btn, .sound-btn, .volume-btn, .playback-btn, .sound-option, .clock-sound-btn');

        buttons.forEach(button => {
          button.addEventListener('touchstart', function() {
            this.style.transform = 'scale(0.95)';
          });

          button.addEventListener('touchend', function() {
            this.style.transform = 'scale(1)';
          });

          button.addEventListener('touchcancel', function() {
            this.style.transform = 'scale(1)';
          });
        });
      }

      // Responsive Clock Scaling
      function adjustClockForMobile() {
        const clockWrapper = document.querySelector('.flip-clock-wrapper');
        const isMobile = window.innerWidth <= 768;
        const isSmallMobile = window.innerWidth <= 480;
        const isExtraSmall = window.innerWidth <= 360;

        if (clockWrapper && isMobile) {
          // Add mobile-specific classes for better scaling
          clockWrapper.classList.add('mobile-optimized');

          if (isExtraSmall) {
            clockWrapper.classList.add('extra-small-mobile');
          } else if (isSmallMobile) {
            clockWrapper.classList.add('small-mobile');
          }
        }
      }

      // Sound Menu Mobile Positioning
      function adjustSoundMenuForMobile() {
        const soundMenu = document.getElementById('soundMenu');
        const soundBtn = document.getElementById('soundBtn');

        if (soundMenu && soundBtn && window.innerWidth <= 768) {
          // Ensure sound menu doesn't go off-screen on mobile
          const rect = soundBtn.getBoundingClientRect();
          const menuWidth = 180; // Mobile menu width

          if (rect.right < menuWidth) {
            soundMenu.style.right = '0px';
            soundMenu.style.left = 'auto';
          }
        }
      }

      // Initialize mobile enhancements
      function initMobileEnhancements() {
        handleMobileResponsive();
        addMobileTouchEnhancements();
      }

      // Event listeners for responsive behavior
      window.addEventListener('resize', function() {
        handleMobileResponsive();
      });

      window.addEventListener('orientationchange', function() {
        setTimeout(function() {
          handleMobileResponsive();
        }, 100);
      });

      // Initialize mobile enhancements when DOM is ready
      initMobileEnhancements();

      // Prevent zoom on double tap for mobile
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      // Add viewport meta tag if not present (for proper mobile scaling)
      if (!document.querySelector('meta[name="viewport"]')) {
        const viewport = document.createElement('meta');
        viewport.name = 'viewport';
        viewport.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
        document.head.appendChild(viewport);
      }
    });
  </script>
</body>
</html>
